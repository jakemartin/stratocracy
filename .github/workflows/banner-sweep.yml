# Runs the architect record's self-consistency sweep on every push and pull request.
#
# WHY CI AND NOT JUST THE HOOK. `Tools/architect/hooks/pre-commit` catches this at the moment
# of commit, but git hooks are not version-controlled and are installed per clone: a commit
# from a machine that never ran `install.sh`, from a fresh worktree, or from the GitHub web
# editor gets no check at all, and nothing announces the gap. This step is the backstop that
# does not depend on anyone's local setup.
#
# WHAT IT CAN AND CANNOT SEE, stated because the difference decides what a green tick means.
# `Saved/` is gitignored, so `Saved/AutomationReport/index.json` does NOT exist on a CI
# checkout. The sweep says so in its own output and falls back to the independent
# `IMPLEMENT_SIMPLE_AUTOMATION_TEST` macro census over `Source/`, which IS tracked. So CI
# checks the record against the tests that exist in the tree -- not against a run of them.
# Verified before this file was written, by cloning the repo to a scratch directory and
# running the sweep there: it reported "no automation report ... suite figures checked against
# each other only", counted 108 by census, and still FAILED a deliberately broken banner.
#
# It does not build the project and does not run the UE suite. Neither is possible on a hosted
# runner without an engine install, and pretending otherwise would make a green tick mean less
# than it does. `build-and-suite.yml` does that half, on a SELF-HOSTED runner; this comment
# points at it rather than describing it, because a restated mechanism is a copy that goes
# stale the day the other file changes and nothing here would notice.

name: banner sweep

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      # Pinned at the major versions that run on a supported Node. Run #1 (2026-08-19) went
      # green on checkout@v4 / setup-python@v5 but warned that both target Node.js 20 and were
      # being forced onto Node 24 -- a deprecation that eventually becomes a hard failure, and
      # one this file introduced rather than inherited.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # THE TOOL IS CHECKED BEFORE ITS VERDICT IS TRUSTED. A sweep whose own fixtures have
      # rotted can report SWEEP CLEAN for the wrong reason, and this project has already
      # shipped one revision of it that was silently inert on the very banner it polices.
      # `--self-test` runs 29 inline fixtures, each proving one check can FAIL. The count is
      # written here only as orientation -- the step runs whatever the script declares, and the
      # script fails the step if any fixture is wrong, so a stale number here cannot make the
      # gate weaker. Six were added with the 2026-08-20 `state/` split: the sentence-final regex
      # blind spot, four cross-file contradiction shapes, and a check that a NEW `.md` dropped
      # into the record directory is swept without editing the script. Six more on 2026-08-22,
      # when the quoted-figure exclusion was found to swallow a live count outright: a reporting
      # verb one sentence upstream, its near-twin in the figure's own sentence, a verbatim code
      # span, an owner file with no live count at all, and a superseded/current banner pair.
      - name: sweep self-test (prove the tool can fail)
        run: python Tools/architect/strat_banner_sweep.py --self-test

      # NO PATH ARGUMENT, DELIBERATELY. The sweep derives its file list from
      # `Tools/architect/state/`, so a record file added in the same PR is covered by this step
      # without anyone remembering to add it here. Naming files here would reintroduce exactly
      # the hand-typed subject list the vendored-citation step below was fixed for.
      - name: banner sweep
        run: python Tools/architect/strat_banner_sweep.py

      # Only on failure, and only then: the per-claim LIVE/STAMPED classification, so whoever
      # reads the red run can see which figure was judged current and argue with the call
      # instead of guessing at it.
      - name: explain the classification (on failure only)
        if: failure()
        run: python Tools/architect/strat_banner_sweep.py --explain

      # THE SAME BAN, IN THE PROSE. The step below scans `Source/` and nothing else, and on
      # 2026-08-20 a reviewer gate found the banned shape had simply moved to where neither
      # guard looks: a record entry citing `Ui.h:326`, plus six more live citations in
      # documentation. `Source/` was clean the whole time. A guard that works exactly where it
      # looks is not the same as a guard that covers its subject.
      #
      # It runs BEFORE the Source/ step deliberately: the docs are where the shape came back,
      # so that is the failure a red run should name first. `--self-test` proves it can fail,
      # and carries an explicit fixture for the hole its historical-account exemption leaves.
      #
      # THE STEP NAME BELOW USED TO SAY "into vendored headers, in the prose", AND BY 2026-08-26
      # THAT WAS TWO-THIRDS WRONG. The gate's subject set was widened that day to cover the
      # record's own growing documents -- `global.md` moves the line you cited by the NEXT entry,
      # faster than any re-vendor -- and its scan was widened to `Tools/architect/*.py`, because
      # four of the six citations that opened the fix lived in a comment rather than in prose. No
      # workflow change was needed to get that coverage: this step passes no paths and the gate
      # derives everything. A step name is the only part of a widening that does NOT update
      # itself, which is exactly why it is the part that ends up lying about what ran.
      - name: doc citation gate self-test (prove the tool can fail)
        run: python Tools/architect/strat_doc_citation_gate.py --self-test

      - name: no rot-prone line citations in the prose or the tooling (vendored + record)
        run: python Tools/architect/strat_doc_citation_gate.py --explain

      # NO LINE-NUMBER CITATIONS INTO VENDORED HEADERS. A `Save.h:64` in a comment is correct
      # the day it is written and wrong the day `Source/StratRules/` is re-vendored -- every one
      # of them at once, silently, with nothing in this repository reading a vendored line number
      # to notice. 58 had accumulated across the tree by 2026-08-19 and were replaced with symbol
      # references (`SaveCommand::unitId`); this keeps them from coming back.
      #
      # THE FILE LIST IS DERIVED FROM THE VENDORED DIRECTORY, NEVER TYPED, and that is the whole
      # correction here. The first version of this step hardcoded an alternation and omitted
      # `Replay` and `Scenario` -- two real vendored units -- so twelve citations of exactly the
      # class it exists to forbid sat in `Source/` while the step printed `clean`. A reviewer
      # gate found it (`VERDICT: BLOCK`, 2026-08-19). A guard that names its own subjects by hand
      # is a guard that silently stops covering the next one added.
      #
      # Citations INSIDE Source/StratRules/ are the vendored files' own and are not our business.
      # Named for the tree it walks, not just the shape it bans, so it cannot be confused with
      # the doc-and-tooling gate above -- the two carried near-identical names and covered
      # different halves of the repository, which is how a reader concludes one of them is
      # redundant and deletes the wrong one.
      - name: no line-number citations into vendored headers, under Source/
        run: |
          units=$(ls Source/StratRules/*.h | xargs -n1 basename | sed 's/\.h$//' | paste -sd'|' -)
          if [ -z "$units" ]; then echo "no vendored headers found -- refusing to pass vacuously"; exit 1; fi
          echo "vendored units derived from Source/StratRules/: $units"
          hits=$(grep -rEn "($units)\.(h|good\.cpp|buggy\.cpp):[0-9]" Source/                  | grep -v "^Source/StratRules/" || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo ""
            echo "Cite the SYMBOL, not the line: \`SaveCommand::unitId\`, not \`Save.h:64\`."
            echo "A re-vendor moves every vendored line at once and nothing here would notice."
            exit 1
          fi
          echo "clean: no vendored line-number citations outside Source/StratRules/"
